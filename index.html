<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f4">
    <meta name="description" content="A calm, practical workspace for semester planning and study progress.">
    <title>ORBIT | Semester workspace</title>
    <link rel="manifest" href="public/manifest.webmanifest">
    <link rel="icon" href="public/icons/icon-192.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="./" aria-label="ORBIT home">
          <img src="public/icons/icon-192.svg" alt="" width="34" height="34">
          <span><strong>ORBIT</strong><small>Semester workspace</small></span>
        </a>
        <p class="nav-label">WORKSPACE</p>
        <nav class="nav-list" id="navigation">
          <button class="nav-item is-active" data-view="overview"><span class="nav-glyph">◫</span>Overview</button>
          <button class="nav-item" data-view="subjects"><span class="nav-glyph">▤</span>Subjects</button>
          <button class="nav-item" data-view="today"><span class="nav-glyph">☑</span>Today<span class="nav-count" id="today-count">0</span></button>
          <button class="nav-item" data-view="revision"><span class="nav-glyph">↻</span>Revision</button>
          <button class="nav-item" data-view="analytics"><span class="nav-glyph">▥</span>Analytics</button>
          <button class="nav-item" data-view="notes"><span class="nav-glyph">▧</span>Notes</button>
        </nav>
        <p class="nav-label nav-label-lower">MORE</p>
        <nav class="nav-list">
          <button class="nav-item" data-view="settings"><span class="nav-glyph">⚙</span>Settings</button>
          <a class="nav-item nav-link" href="assignent%20-%202/" aria-label="Open assignment work"><span class="nav-glyph">↗</span>Assignment work</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="semester-mini"><span class="mini-dot"></span><span><strong id="sidebar-term">Semester 4</strong><small id="sidebar-program">B.Tech CSE · AIML</small></span></div>
          <div class="sidebar-progress"><div><span>Semester progress</span><strong id="sidebar-progress">0%</strong></div><div class="progress-track"><span id="sidebar-progress-bar"></span></div></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span id="top-program">B.Tech CSE · AIML</span><span class="crumb-slash">/</span><strong id="page-label">Overview</strong></div>
          <div class="top-actions">
            <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search your semester" aria-label="Search subjects, topics and tasks"><kbd>/</kbd></label>
            <button class="icon-button" id="theme-toggle" aria-label="Switch color theme" title="Switch color theme">◐</button>
            <button class="user-avatar" type="button" data-view="settings" aria-label="Open settings">K</button>
          </div>
        </header>
        <section class="content" id="app-content" aria-live="polite"></section>
        <nav class="mobile-nav" aria-label="Mobile navigation">
          <button class="is-active" data-view="overview"><span>◫</span>Home</button>
          <button data-view="subjects"><span>▤</span>Subjects</button>
          <button data-view="today"><span>☑</span>Today</button>
          <button data-view="revision"><span>↻</span>Review</button>
          <button data-view="settings"><span>⚙</span>More</button>
        </nav>
      </main>
    </div>

    <dialog id="task-dialog" class="form-dialog">
      <form method="dialog" id="task-form">
        <div class="dialog-heading"><div><p class="eyebrow">PLAN YOUR DAY</p><h2>Add a study task</h2></div><button class="icon-button close-dialog" aria-label="Close">×</button></div>
        <label>Task name<input name="title" required maxlength="100" placeholder="e.g. Review neural networks"></label>
        <div class="form-row"><label>Subject<select name="subject" id="task-subject" required></select></label><label>Time<select name="minutes"><option value="25">25 min</option><option value="45" selected>45 min</option><option value="60">1 hour</option><option value="90">90 min</option></select></label></div>
        <label>Due date<input name="date" type="date" required></label>
        <div class="dialog-actions"><button class="button button-quiet close-dialog" type="button">Cancel</button><button class="button button-primary" type="submit">Add task <span>↗</span></button></div>
      </form>
    </dialog>

    <dialog id="note-dialog" class="form-dialog">
      <form method="dialog" id="note-form">
        <div class="dialog-heading"><div><p class="eyebrow">QUICK CAPTURE</p><h2>Write a note</h2></div><button class="icon-button close-dialog" aria-label="Close">×</button></div>
        <label>Title<input name="title" required maxlength="100" placeholder="Give this note a title"></label>
        <label>Note<textarea name="body" rows="5" required placeholder="Capture a definition, idea, or question..."></textarea></label>
        <label>Subject<select name="subject" id="note-subject"></select></label>
        <div class="dialog-actions"><button class="button button-quiet close-dialog" type="button">Cancel</button><button class="button button-primary" type="submit">Save note <span>↗</span></button></div>
      </form>
    </dialog>

    <dialog id="focus-dialog" class="focus-dialog">
      <button class="icon-button focus-close close-dialog" aria-label="Close focus timer">×</button>
      <p class="eyebrow">FOCUS SESSION</p><h2 id="focus-title">One thing at a time.</h2>
      <div class="timer-readout" id="timer-readout">25:00</div>
      <p class="focus-caption" id="focus-caption">A short session is a good place to start.</p>
      <div class="focus-controls"><button class="button button-quiet" id="timer-reset">Reset</button><button class="button button-primary" id="timer-toggle">Start focus <span>▶</span></button></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
